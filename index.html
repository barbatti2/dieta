<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — Mapa Muscular (body-highlighter)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F1;
    --surface:#FFFFFF;
    --ink:#1F1D1B;
    --muted:#8A8378;
    --accent:#C9482F;
    --accent-soft:#E7B8A9;
    --border:#D8D3C8;
    --olive:#3D5A4C;
    --olive-soft:#DCE4DE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:32px 16px 60px;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:420px;}
  h1{font-family:'Fraunces',serif;font-size:22px;font-weight:500;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 24px;}

  .exercise-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .ex-btn{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--ink);
    padding:9px 14px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
  }
  .ex-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
  }
  .view-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .view-toggle button{
    flex:1;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--muted);
    padding:8px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
  }
  .view-toggle button.active{color:var(--ink);border-color:var(--accent);}

  #model{display:flex;justify-content:center;min-height:280px;}

  .legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .dot.primary{background:var(--accent);}
  .dot.secondary{background:var(--accent-soft);}

  .note{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mapa Muscular</h1>
  <p class="sub">Usando a lib open source <b>body-highlighter</b> (MIT)</p>

  <div class="exercise-list" id="exerciseList"></div>

  <div class="card">
    <div class="view-toggle">
      <button id="btnFront" class="active">Frente</button>
      <button id="btnBack">Costas</button>
    </div>
    <div id="model"></div>
    <div class="legend">
      <span><i class="dot primary"></i>Principal</span>
      <span><i class="dot secondary"></i>Secundário</span>
    </div>
  </div>

  <p class="note">Biblioteca MIT license, sem dependência de framework — importada aqui via CDN (esm.sh) só pra essa demo rodar direto no navegador sem passo de build.</p>
</div>

<script type="module">
import createBodyHighlighter from 'https://esm.sh/body-highlighter';

const exercises = [
  {
    nome: "Supino Reto",
    primary: ["chest"],
    secondary: ["front-deltoids", "triceps"]
  },
  {
    nome: "Remada Curvada",
    primary: ["upper-back"],
    secondary: ["biceps", "back-deltoids"]
  },
  {
    nome: "Agachamento Livre",
    primary: ["quadriceps"],
    secondary: ["gluteal", "hamstring"]
  }
];

const backMuscles = ["trapezius","upper-back","lower-back","triceps","back-deltoids","gluteal","hamstring"];

let current = exercises[0];
let view = "anterior";
let highlighter = null;

const listEl = document.getElementById("exerciseList");
const modelEl = document.getElementById("model");
const btnFront = document.getElementById("btnFront");
const btnBack = document.getElementById("btnBack");

function renderList(){
  listEl.innerHTML = "";
  exercises.forEach(ex => {
    const b = document.createElement("button");
    b.className = "ex-btn" + (ex === current ? " active" : "");
    b.textContent = ex.nome;
    b.onclick = () => select(ex);
    listEl.appendChild(b);
  });
}

function select(ex){
  current = ex;
  const hasBack = ex.primary.some(m => backMuscles.includes(m));
  view = hasBack ? "posterior" : "anterior";
  renderList();
  renderModel();
}

function renderModel(){
  btnFront.classList.toggle("active", view === "anterior");
  btnBack.classList.toggle("active", view === "posterior");

  if (highlighter) highlighter.destroy();
  modelEl.innerHTML = "";

  const data = [
    { name: current.nome + " (principal)", muscles: current.primary, frequency: 2 },
    { name: current.nome + " (secundário)", muscles: current.secondary, frequency: 1 }
  ];

  highlighter = createBodyHighlighter({
    container: modelEl,
    data,
    type: view,
    bodyColor: "#D8D3C8",
    highlightedColors: ["#E7B8A9", "#C9482F"],
    style: { width: "220px" }
  });
}

btnFront.onclick = () => { view = "anterior"; renderModel(); };
btnBack.onclick = () => { view = "posterior"; renderModel(); };

renderList();
renderModel();
</script>
</body>
</html>
